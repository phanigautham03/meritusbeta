<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="55%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="48" height="48" rx="12"/>
    </clipPath>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <!-- Subtle inner top-edge glow -->
    <ellipse cx="24" cy="2" rx="20" ry="7" fill="white" fill-opacity="0.07"/>

    <!-- ══════════════════════════════════
         RISING SUN
         Semicircle cresting a horizon line,
         7 rays fanning upward.
         Replaces the 4-pointed star.
    ══════════════════════════════════ -->

    <!-- Dawn glow — soft radiance under the horizon -->
    <ellipse cx="24" cy="14" rx="9" ry="2.5" fill="#D97706" fill-opacity="0.10"/>

    <!-- Horizon line -->
    <line x1="15" y1="14" x2="33" y2="14"
          stroke="#D97706" stroke-opacity="0.40" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Sun disc — upper semicircle rising above horizon -->
    <path d="M18.5 14 A5.5 5.5 0 0 1 29.5 14 Z"
          fill="#D97706" fill-opacity="0.92"/>

    <!-- Specular highlight on sun disc -->
    <circle cx="22.2" cy="11.2" r="1.3" fill="white" fill-opacity="0.32"/>

    <!-- 7 rays fanning upward (centre, ±20°, ±40°, ±60°) -->
    <!-- Centre — straight up -->
    <line x1="24"    y1="8.5"  x2="24"    y2="4.8"
          stroke="#D97706" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.92"/>
    <!-- ±20° -->
    <line x1="22.1"  y1="8.8"  x2="20.85" y2="5.4"
          stroke="#D97706" stroke-width="1.25" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="25.9"  y1="8.8"  x2="27.15" y2="5.4"
          stroke="#D97706" stroke-width="1.25" stroke-linecap="round" stroke-opacity="0.85"/>
    <!-- ±40° -->
    <line x1="20.45" y1="9.8"  x2="18.1"  y2="7.0"
          stroke="#D97706" stroke-width="1.1"  stroke-linecap="round" stroke-opacity="0.72"/>
    <line x1="27.55" y1="9.8"  x2="29.9"  y2="7.0"
          stroke="#D97706" stroke-width="1.1"  stroke-linecap="round" stroke-opacity="0.72"/>
    <!-- ±60° -->
    <line x1="19.24" y1="11.25" x2="16.0"  y2="9.4"
          stroke="#D97706" stroke-width="0.95" stroke-linecap="round" stroke-opacity="0.58"/>
    <line x1="28.76" y1="11.25" x2="32.0"  y2="9.4"
          stroke="#D97706" stroke-width="0.95" stroke-linecap="round" stroke-opacity="0.58"/>

    <!-- ── M letterform (unchanged) ── -->
    <path d="M9 40 L9 19 L24 30 L39 19 L39 40"
          stroke="white" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Gold summit dots at M peaks (unchanged) -->
    <circle cx="9"  cy="19" r="2.8" fill="#D97706" fill-opacity="0.55"/>
    <circle cx="39" cy="19" r="2.8" fill="#D97706" fill-opacity="0.55"/>
  </g>
</svg>
